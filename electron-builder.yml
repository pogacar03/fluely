appId: com.pogacar03.fluely
productName: Fluely
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - dist-electron/**
  - package.json
  - assets/icon.svg
  - '!**/*.map'
  - '!**/*.test.*'
  - '!**/.env'
  - '!**/.env.*'
asar: true
mac:
  category: public.app-category.productivity
  target:
    - zip
